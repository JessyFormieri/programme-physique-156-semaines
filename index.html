function timerTick(){if(!timer.running)return;if(timer.type==='simple'){timer.elapsed=Math.floor((Date.now()-timer.start)/1000);timerUpdate()}else if(timer.type==='countdown'){timer.cd--;if(timer.cd<=0){timer.cd=0;timer.running=false;beep()};timerUpdate()}else{timer.remaining--;if(timer.remaining<=0){if(timer.phase==='prep'){timer.phase='work';timer.remaining=timer.cycles[timer.cycle].work}else if(timer.phase==='work'){timer.phase='rest';timer.remaining=timer.cycles[timer.cycle].rest}else{timer.cycle++;if(timer.cycle>=timer.cycles.length){timer.running=false;beep();timer.cycle=0;timer.phase='prep';timer.remaining=timer.cycles[0].prep}else{timer.phase='prep';timer.remaining=timer.cycles[timer.cycle].prep}}}timerUpdate()}}
function timerUpdate(){let el=document.querySelector('.timer-pop');if(el)el.outerHTML=timerPanel()};function beep(){try{let c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch{}}
function render(){document.querySelectorAll('.share-menu').forEach(m=>m.remove());document.getElementById('app').innerHTML=`<aside class="sidebar ${state.menu?'open':''}"><div class="brand"><b>PROJECT PHYSIQUE</b><small>156 semaines · cycle ${cycle()}</small></div><nav class="nav">${nav().map(([id,l])=>`<button class="${state.page===id?'active':''}" data-nav="${id}">${icon(id)} &nbsp;${l}</button>`).join('')}</nav></aside><main class="main"><header class="top"><button class="hamb" data-action="menu">☰</button><button class="timerBtn" data-action="toggleTimers">⏱</button><h1>${nav().find(x=>x[0]===state.page)?.[1]}</h1><span class="spacer"></span><span class="pill">S${state.week}/156 · ${phase()[2]}</span></header><section class="content">${({dashboard,mobility,training,nutrition,prs,body,recovery,trajectory,milestones,settings})[state.page]()}</section></main>${timerOpen?timerPanel():''}<div id="modalHost"></div>`;bind();if(timerInt===null)timerInt=setInterval(timerTick,1000)}
function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.page=b.dataset.nav;state.menu=false;save();render()});document.querySelector('[data-action="menu"]')?.addEventListener('click',()=>{state.menu=!state.menu;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{let ds=dateRange()[+b.dataset.day-1];setDate(ds)});document.querySelector('[data-action="today"]')?.addEventListener('click',()=>setDate(new Date()));document.querySelector('[data-action="calendar"]')?.addEventListener('click',()=>{let old=document.getElementById('miniCal');if(old)old.remove();else{let d=document.createElement('div');d.innerHTML=calendar();document.querySelector('.top').appendChild(d.firstElementChild);document.querySelectorAll('[data-caldate]').forEach(b=>b.onclick=()=>setDate(fromIso(b.dataset.caldate)));document.querySelectorAll('[data-calnav]').forEach(b=>b.onclick=()=>{let d2=dateFor();d2.setMonth(d2.getMonth()+ +b.dataset.calnav);state.date=iso(d2);save();let host=document.getElementById('miniCal');if(host)host.outerHTML=calendar();bind()})}});document.getElementById('weekSelect')?.addEventListener('change',e=>{state.week=+e.target.value;let d=new Date(PROGRAM_START);d.setDate(d.getDate()+(state.week-1)*7+(state.day-1));state.date=iso(d);save();render()});document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{state.selectedZone=b.dataset.zone;save();render()});document.querySelectorAll('[data-graph]').forEach(s=>s.onchange=()=>{let k=s.dataset.graph;state.selectedGraph[k]=s.value;save();render()});document.getElementById('activityRange')?.addEventListener('change',e=>{state.activityRange=e.target.value;render()});document.getElementById('protoDuration')?.addEventListener('change',e=>{state.mobProtoDuration=+e.target.value;save();render()});document.querySelectorAll('[data-proto]').forEach(b=>b.onclick=()=>openProtocol(b.dataset.proto));document.querySelector('[data-action="startMobTest"]')?.addEventListener('click',openMobTest);document.querySelectorAll('[data-measure]').forEach(i=>i.onchange=()=>state.measures[i.dataset.measure]=+i.value);document.querySelector('[data-action="saveBody"]')?.addEventListener('click',()=>{document.querySelectorAll('[data-measure]').forEach(i=>state.measures[i.dataset.measure]=+i.value);state.weight=+document.getElementById('weight').value;state.bf=+document.getElementById('bf').value;save();toast('Mensurations enregistrées');render()});document.querySelector('[data-action="snapshot"]')?.addEventListener('click',()=>{state.measureHistory.push({date:iso(new Date()),weight:state.weight,bf:state.bf,...state.measures});save();toast('Point enregistré');render()});document.querySelectorAll('[data-bodyzone]').forEach(b=>b.onclick=()=>{state.bodyZone=b.dataset.bodyzone;save();render()});document.querySelectorAll('[data-bodyview]').forEach(b=>b.onclick=()=>{state.bodyView=b.dataset.bodyview;render()});document.querySelectorAll('[data-log]').forEach(i=>i.onchange=()=>{let id=state.week+'-'+state.day+'-'+i.dataset.log;state.sessionLogs[id]=state.sessionLogs[id]||{};state.sessionLogs[id][i.dataset.field]=i.value;save()});document.querySelector('[data-action="finishSession"]')?.addEventListener('click',()=>{state.sessionLogs[state.week+'-'+state.day]={...(state.sessionLogs[state.week+'-'+state.day]||{}),duration:75,date:iso(new Date())};save();toast('Séance enregistrée');});document.querySelectorAll('[data-meal]').forEach(i=>i.onchange=()=>{state.mealLogs[i.dataset.meal]=i.checked;save()});document.getElementById('shopRange')?.addEventListener('change',e=>{document.getElementById('shopList').innerHTML=shopList(e.target.value)});document.querySelector('[data-action="shareShop"]')?.addEventListener('click',shareShop);document.querySelector('[data-action="saveRecovery"]')?.addEventListener('click',()=>{state.recovery.push({date:iso(new Date()),sleep:+document.getElementById('sleep').value,fatigue:+document.getElementById('fatigue').value,stress:+document.getElementById('stress').value,motivation:+document.getElementById('motivation').value});save();toast('Récupération enregistrée');render()});document.querySelector('[data-action="savePR"]')?.addEventListener('click',savePR);document.querySelectorAll('[data-editpr]').forEach(b=>b.onclick=()=>{let p=state.prs.find(x=>x.id===b.dataset.editpr);if(p){document.getElementById('prMove').value=p.name;document.getElementById('prCat').value=p.cat;document.getElementById('prVal').value=p.value;document.getElementById('prUnit').value=p.unit}});document.querySelector('[data-action="saveSettings"]')?.addEventListener('click',()=>{state.settings.height=+document.getElementById('height').value;save();toast('Réglages enregistrés');render()});document.getElementById('importFile')?.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state={...state,...x};state.programActive=false;save();toast('Programmation importée · prête à lancer');render()}catch{toast('JSON invalide')}};r.readAsText(f)});document.querySelector('[data-action="launchProgram"]')?.addEventListener('click',()=>{state.programActive=true;state.week=1;state.day=1;state.date=iso(PROGRAM_START);save();toast('Nouvelle programmation lancée · lundi semaine 1');render()});document.querySelector('[data-action="export"]')?.addEventListener('click',()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='project-physique-156-backup.json';a.click()});document.querySelector('[data-action="reset"]')?.addEventListener('click',()=>{if(confirm('Réinitialiser toutes les données ?')){localStorage.removeItem(KEY);location.reload()}});document.querySelector('[data-action="toggleTimers"]')?.addEventListener('click',()=>{timerOpen=!timerOpen;render()});document.querySelector('[data-action="closeTimer"]')?.addEventListener('click',()=>{timerOpen=false;render()});document.querySelectorAll('[data-tmode]').forEach(b=>b.onclick=()=>{timer.type=b.dataset.tmode;timer.running=false;if(timer.type==='interval'){timer.cycle=0;timer.phase='prep';timer.remaining=timer.cycles[0].prep}render()});document.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>timerAction(b));document.querySelectorAll('[data-cycle]').forEach(i=>i.onchange=()=>{timer.cycles[+i.dataset.cycle][i.dataset.f]=+i.value;if(timer.phase==='prep'&&!timer.running)timer.remaining=timer.cycles[0].prep});document.querySelector('[data-action="closeTimer"]')?.addEventListener('click',()=>{timerOpen=false;render()});document.querySelectorAll('[data-closemodal]').forEach(b=>b.onclick=()=>document.getElementById('modalHost').innerHTML='')}
function timerAction(b){let a=b.dataset.timer;if(a==='start'){if(timer.type==='simple'){timer.start=Date.now()-timer.elapsed*1000}else if(timer.type==='countdown'){timer.cd=+document.getElementById('timerInput').value||timer.cd}else{timer.cycle=0;timer.phase='prep';timer.remaining=timer.cycles[0].prep}timer.running=true;toast('Chrono démarré')}else if(a==='pause'){if(timer.type==='simple')timer.elapsed=Math.floor((Date.now()-timer.start)/1000);timer.running=false;toast('Chrono en pause')}else if(a==='reset'){timer.running=false;timer.elapsed=0;timer.cd=+document.getElementById('timerInput')?.value||60;timer.cycle=0;timer.phase='prep';timer.remaining=timer.cycles[0].prep}else if(a==='addcycle'){timer.cycles.push({prep:10,work:20,rest:10})}else if(a==='delcycle'){if(timer.cycles.length>1)timer.cycles.splice(+b.dataset.i,1)}render()}
function savePR(){let name=document.getElementById('prMove').value,cat=document.getElementById('prCat').value,value=+document.getElementById('prVal').value,unit=document.getElementById('prUnit').value;if(!name||!Number.isFinite(value))return toast('Renseigne le mouvement et la valeur');let old=state.prs.find(p=>p.name===name&&p.unit===unit);if(old){old.value=value;old.date=iso(new Date());old.cat=cat}else state.prs.push({id:crypto.randomUUID(),name,cat,value,unit,date:iso(new Date())});save();toast('PR enregistré');render()}
function shareShop(){document.querySelectorAll('.share-menu').forEach(m=>m.remove());let range=document.getElementById('shopRange')?.value||'jour';let text='PROJECT PHYSIQUE · Liste de courses '+range+'\n\n'+Object.entries({'Avoine':60,'Skyr':200,'Fruits rouges':150,'Amandes':15,'Poulet':180,'Riz cuit':280,'Courgettes':250,'Huile olive':10,'Whey':30,'Banane':1,'Pain complet':70,'Beurre cacahuète':15,'Saumon':160,'Pommes de terre':350,'Haricots verts':250}).map(([k,v])=>`• ${k}: ${range==='semaine'?v*7:v}${k==='Banane'?' pièce':' g'}`).join('\n');let url='https://wa.me/?text='+encodeURIComponent(text);let menu=document.createElement('div');menu.className='share-menu';menu.style.right='18px';menu.style.top='100px';menu.innerHTML=`<button class="btn" data-share="native">Partager…</button><a class="btn" target="_blank" href="${url}">WhatsApp</a><a class="btn" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}">Messenger / Facebook</a><button class="btn" data-share="copy">Copier le message</button>`;document.body.appendChild(menu);menu.querySelector('[data-share="native"]').onclick=async()=>{if(navigator.share)await navigator.share({title:'Liste de courses',text});else await navigator.clipboard.writeText(text);menu.remove()};menu.querySelector('[data-share="copy"]').onclick=async()=>{await navigator.clipboard.writeText(text);toast('Liste copiée');menu.remove()};setTimeout(()=>{document.addEventListener('click',function outside(e){if(!menu.contains(e.target)&&e.target.closest('[data-action="shareShop"]')===null){menu.remove();document.removeEventListener('click',outside)}})},0)}
/* ===== UX / interaction refinements ===== */
function activityBuckets(range){
  const logs=Object.values(state.sessionLogs||{}).filter(x=>x.date||x.duration);
  const now=new Date(state.date||new Date());
  let labels=[],vals=[];
  if(range==='jours'){
    for(let i=6;i>=0;i--){let d=new Date(now);d.setDate(d.getDate()-i);labels.push(d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.',''));let key=iso(d);vals.push(logs.filter(x=>x.date===key).reduce((a,x)=>a+(+x.duration||0)/60,0));}
  } else if(range==='semaine'){
    for(let i=7;i>=0;i--){let end=new Date(now);end.setDate(end.getDate()-i*7);let start=new Date(end);start.setDate(start.getDate()-6);labels.push('S'+weekNumber(end));vals.push(logs.filter(x=>x.date&&fromIso(x.date)>=start&&fromIso(x.date)<=end).reduce((a,x)=>a+(+x.duration||0)/60,0));}
  } else if(range==='mois'){
    for(let i=5;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1);let end=new Date(d.getFullYear(),d.getMonth()+1,0);labels.push(d.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''));vals.push(logs.filter(x=>x.date&&fromIso(x.date)>=d&&fromIso(x.date)<=end).reduce((a,x)=>a+(+x.duration||0)/60,0));}
  } else {
    for(let i=4;i>=0;i--){let y=now.getFullYear()-i;labels.push(String(y));vals.push(logs.filter(x=>x.date&&fromIso(x.date).getFullYear()===y).reduce((a,x)=>a+(+x.duration||0)/60,0));}
  }
  return {labels,vals};
}
function weekNumber(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));let day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function barGraph(vals,labels,unit='h'){let w=760,h=230,p=34,mx=Math.max(1,...vals),bw=Math.min(52,(w-2*p)/Math.max(1,vals.length)-10);let bars=vals.map((v,i)=>{let x=p+i*((w-2*p)/Math.max(1,vals.length));let bh=(v/mx)*(h-65),y=h-35-bh;return `<rect x="${x+5}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="var(--green)" opacity=".82"/><text x="${x+5+bw/2}" y="${h-14}" text-anchor="middle" fill="var(--muted)" font-size="11">${labels[i]}</text><text x="${x+5+bw/2}" y="${Math.max(14,y-5)}" text-anchor="middle" fill="var(--txt)" font-size="11">${v.toFixed(1)}</text>`}).join('');return `<svg class="graph" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="M${p} ${h-35}H${w-p}" stroke="#233744"/>${bars}<text x="8" y="16" fill="var(--muted)" font-size="11">${unit}</text></svg>`}
function dashboard(){let m=mobScore(),sleep=state.recovery.slice(-7).map(x=>+x.sleep).filter(Boolean),av=sleep.length?sleep.reduce((a,b)=>a+b,0)/sleep.length:8;let ar=state.activityRange||'semaine',b=activityBuckets(ar);return `<div class="hero"><div><h2>Dashboard</h2><div class="muted">${fmt(dateFor())} · Semaine ${state.week}/156 · ${phase()[2]}</div></div></div><div class="grid g4"><div class="card kpi"><div class="label">Progression</div><div class="value">${Math.round(state.week/156*100)}%</div><div class="bar"><i style="width:${state.week/156*100}%"></i></div></div><div class="card kpi"><div class="label">Poids</div><div class="value">${state.weight} kg</div><div class="sub">Masse grasse ${state.bf}%</div></div><div class="card kpi"><div class="label">Mobilité</div><div class="value">${m}/100</div><div class="sub">8 zones · tests enregistrés</div></div><div class="card kpi"><div class="label">Sommeil moyen</div><div class="value">${av.toFixed(1)} h</div><div class="sub">Cible pratique 8 h</div></div></div><div class="grid g3" style="margin-top:14px"><div class="card"><div class="section-title">Cycle actuel</div><h3>${phase()[2]}</h3><p class="muted">${phase()[6]}</p><div class="bar"><i style="width:${weekCycle()/6*100}%"></i></div><p class="muted">S${weekCycle()}/6</p></div><div class="card"><div class="section-title">Séance du jour</div><h3>${dayCode()==='R'?'Récupération active':sessions[dayCode()]}</h3><p class="muted">${fmt(dateFor())} · objectif 60–90 min</p><button class="btn primary" data-nav="training">Lancer la séance</button></div><div class="card"><div class="section-title">Macros du jour</div><div class="row"><span class="tag">${phase()[3]} kcal</span><span class="tag">P ${phase()[4]}g</span><span class="tag">G ${phase()[5]}g</span><span class="tag">L ${phase()[6]}g</span></div></div></div><div class="grid g2" style="margin-top:14px"><div class="card">${chartCard('dashboard',['Poids','Masse grasse','Mobilité'],state.selectedGraph.dashboard==='Masse grasse'?[state.bf,state.bf,state.bf]:state.selectedGraph.dashboard==='Mobilité'?[m,m,m]:[state.weight,state.weight,state.weight],'Tendance','')}</div><div class="card"><div class="section-title">Derniers PRs</div>${state.prs.slice(-4).reverse().map(p=>`<div class="pr-item"><span>${p.name}</span><b>${p.value} ${p.unit||''}</b></div>`).join('')||'<div class="empty">Aucun PR enregistré.</div>'}</div></div><div class="card" style="margin-top:14px"><div class="select-row"><div><div class="section-title">Tendance d’activités</div><div class="muted">Heures d’activité selon la période choisie</div></div><select class="graph-select" id="activityRange"><option ${ar==='jours'?'selected':''}>jours</option><option ${ar==='semaine'?'selected':''}>semaine</option><option ${ar==='mois'?'selected':''}>mois</option><option ${ar==='année'?'selected':''}>année</option></select></div>${barGraph(b.vals,b.labels,'heures')}</div>`}
const favDur=[10,20,30,60,90,120,150,300,600,900,1200,1800,2700,3600,5400,7200];
function durLabel(s){if(s===60)return '1min';if(s===90)return '1min30s';if(s===120)return '2min';if(s===150)return '2min30s';if(s===3600)return '1h';if(s===5400)return '1h30';if(s===7200)return '2h';return s<60?s+'s':Math.floor(s/60)+'min'}
function simpleTimer(){let v=timer.type==='simple'?timer.elapsed:timer.cd;return `<div class="timer-display">${fmtClock(v)}</div>${timer.type==='countdown'?`<div class="row"><label style="flex:1">Durée favorite<select id="timerFav">${favDur.map(x=>`<option value="${x}" ${timer.cd===x?'selected':''}>${durLabel(x)}</option>`).join('')}</select></label><label style="flex:1">Durée personnalisée (s)<input id="timerCustom" type="number" min="1" value="${timer.cd}"></label></div>`:''}<div class="timer-actions"><button class="btn ${timer.last==='start'?'active-green':''}" data-timer="start">▶ Démarrer</button><button class="btn ${timer.last==='pause'?'active-green':''}" data-timer="pause">Ⅱ Pause</button><button class="btn ${timer.last==='reset'?'active-green':''}" data-timer="reset">↺ Reset</button></div>`}
function intervalTimer(){return `<div class="timer-display">${timer.phase.toUpperCase()} · ${fmtClock(timer.remaining)}</div><div class="section-title">Cycles personnalisés <button class="btn" data-timer="addcycle">＋ Ajouter un cycle</button></div>${timer.cycles.map((c,i)=>`<div class="cycle-row"><b>Cycle ${i+1}</b><label>Prépa<input data-cycle="${i}" data-f="prep" type="number" min="0" value="${c.prep}"></label><label>Exercice<input data-cycle="${i}" data-f="work" type="number" min="1" value="${c.work}"></label><label>Repos<input data-cycle="${i}" data-f="rest" type="number" min="0" value="${c.rest}"></label><button class="btn danger" data-timer="delcycle" data-i="${i}">×</button></div>`).join('')}<div class="timer-actions"><button class="btn ${timer.last==='start'?'active-green':''}" data-timer="start">▶ Démarrer</button><button class="btn ${timer.last==='pause'?'active-green':''}" data-timer="pause">Ⅱ Pause</button><button class="btn ${timer.last==='reset'?'active-green':''}" data-timer="reset">↺ Reset</button></div>`}
function timerPanel(){return `<div class="timer-pop"><div class="row" style="justify-content:space-between"><b>Chronos</b><button class="close" data-action="closeTimer">×</button></div><div class="timer-tabs"><button class="${timer.type==='simple'?'active':''}" data-tmode="simple">Simple</button><button class="${timer.type==='countdown'?'active':''}" data-tmode="countdown">Compte à rebours</button><button class="${timer.type==='interval'?'active':''}" data-tmode="interval">Chrono personnalisé</button></div>${timer.type==='interval'?intervalTimer():simpleTimer()}</div>`}
function timerAction(b){let a=b.dataset.timer;timer.last=a;if(a==='start'){if(timer.type==='simple'){timer.start=Date.now()-timer.elapsed*1000}else if(timer.type==='countdown'){timer.cd=+(document.getElementById('timerFav')?.value||document.getElementById('timerCustom')?.value||timer.cd);if(timer.cd<=0)timer.cd=60}else{if(!timer.running&&timer.remaining<=0)timer.remaining=timer.cycles[0].prep;timer.cycle=Math.min(timer.cycle,timer.cycles.length-1)}timer.running=true;beepStart();toast('Chrono démarré')}else if(a==='pause'){if(timer.type==='simple')timer.elapsed=Math.floor((Date.now()-timer.start)/1000);timer.running=false}else if(a==='reset'){timer.running=false;timer.elapsed=0;timer.cd=60;timer.cycle=0;timer.phase='prep';timer.remaining=timer.cycles[0].prep}else if(a==='addcycle'){timer.cycles.push({prep:10,work:20,rest:10})}else if(a==='delcycle'){if(timer.cycles.length>1)timer.cycles.splice(+b.dataset.i,1)}timerUpdate();bind()}
function beepStart(){beep();}
function timerTick(){if(!timer.running)return;if(timer.type==='simple'){timer.elapsed=Math.floor((Date.now()-timer.start)/1000);timerUpdate();return}if(timer.type==='countdown'){timer.cd=Math.max(0,timer.cd-1);if(timer.cd<=3)beep();if(timer.cd===0){timer.running=false;beepEnd()}timerUpdate();return}timer.remaining=Math.max(0,timer.remaining-1);if(timer.remaining<=3&&timer.remaining>0)beep();if(timer.remaining===0){let guard=0;while(timer.running&&timer.remaining===0&&guard<100){guard++;if(timer.phase==='prep'){timer.phase='work';timer.remaining=timer.cycles[timer.cycle].work}else if(timer.phase==='work'){timer.phase='rest';timer.remaining=timer.cycles[timer.cycle].rest}else{timer.cycle++;if(timer.cycle>=timer.cycles.length){timer.running=false;beepEnd();timer.cycle=0;timer.phase='prep';timer.remaining=timer.cycles[0].prep;break}else{timer.phase='prep';timer.remaining=timer.cycles[timer.cycle].prep}}}if(timer.running)beepTong()}timerUpdate()}
function beepTone(freq=880,d=.12){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.value=.06;o.start();o.stop(c.currentTime+d)}catch{}}
function beep(){beepTone(880,.10)}function beepEnd(){beepTone(600,.45)}function beepTong(){beepTone(420,.22)}
function timerUpdate(){let el=document.querySelector('.timer-pop');if(el){el.outerHTML=timerPanel();bind()}}
// extend binding for favorite/custom countdown controls
const _bind=bind;bind=function(){_bind();document.getElementById('timerFav')?.addEventListener('change',e=>{timer.cd=+e.target.value;timer.last='';timerUpdate()});document.getElementById('timerCustom')?.addEventListener('change',e=>{timer.cd=Math.max(1,+e.target.value||1);timer.last='';timerUpdate()});document.querySelector('[data-action="closeTimer"]')?.addEventListener('click',()=>{timerOpen=false;document.querySelector('.timer-pop')?.remove()});};
render();
