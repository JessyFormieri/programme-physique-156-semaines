function chart(vals,label='',unit=''){if(!vals.length)vals=[0,0];let max=Math.max(...vals),min=Math.min(...vals);if(max===min){max+=1;min-=1}let w=640,h=150;let pts=vals.map((v,i)=>`${i*(w/(vals.length-1||1))},${h-15-(v-min)/(max-min)*(h-30)}`).join(' ');return `<div class="muted mini">${label}</div><svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="muted mini">${vals.at(-1)}${unit}</div>`}

function nutrition(){let p=phase();let train=dayInfo()[2]!=='R';let target=train?p.kcal:p.kcal-250;let meals=[['Petit-déjeuner','Avoine 60 g · œufs 3 · skyr 150 g · fruits rouges 100 g','≈ 600 kcal'],['Déjeuner','Poulet 180 g · riz cuit 250 g · légumes 200 g · huile 10 g','≈ 700 kcal'],['Collation','Whey 30 g · banane · 3 galettes de riz','≈ 350 kcal'],['Dîner','Saumon 170 g · pommes de terre 300 g · légumes 250 g · huile 10 g','≈ 650 kcal']];return `<div class="hero"><div><h2>Nutrition</h2><div class="muted">Programmation automatique selon la phase et journée ${train?'entraînement':'repos'}.</div></div><div class="pill">${target} kcal · P ${p.p} g · L ${p.f} g · G ${train?p.c:Math.max(180,p.c-55)} g</div></div><div class="grid g3"><div class="card kpi"><div class="label">Calories cible</div><div class="value">${target}</div><div class="sub">${train?'Jour entraînement':'Jour repos'}</div></div><div class="card kpi"><div class="label">Protéines</div><div class="value">${p.p} g</div><div class="sub">≈ 2,2 g/kg</div></div><div class="card kpi"><div class="label">Ajustement</div><div class="value">${state.week%2?'stable':'+100'}</div><div class="sub">Réviser toutes les 2 semaines</div></div></div><div class="card" style="margin-top:14px"><div class="section-title">Menu automatique du jour</div>${meals.map((m,i)=>`<div class="session"><div class="row" style="justify-content:space-between"><div><b>${m[0]}</b><p class="muted" style="margin:4px 0">${m[1]}</p></div><span class="tag">${m[2]}</span></div><label class="check"><input type="checkbox" data-meal="${i}" ${state.mealChecks[i]?'checked':''}> Consommé</label></div>`).join('')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="section-title">Règle d’ajustement 14 jours</div><p class="muted">Si le poids moyen ne bouge pas pendant 14 jours avec performances stables → +100 à +150 kcal. Si le poids/tour de taille monte trop vite → -100 à -150 kcal. Protéines maintenues.</p></div><div class="card"><div class="section-title">Liste de courses</div>${['Poulet 1,3 kg','Saumon 1,2 kg','Œufs 21','Skyr 1,05 kg','Whey 210 g','Avoine 420 g','Riz 2 kg cuit équivalent','Pommes de terre 2,1 kg','Légumes 3,2 kg','Fruits rouges 700 g','Bananes 7','Huile d’olive 140 g'].map((x,i)=>`<label class="check"><input type="checkbox" data-shop="${i}" ${state.shopChecks[i]?'checked':''}>${x}</label>`).join('')}<button class="btn" style="margin-top:10px" data-action="printShop">Imprimer</button></div></div>`}

/div>`}
function recovery(){let last=state.recovery.at(-1),avg=state.recovery.slice(-7).map(x=>+x.sleep).filter(Boolean),a=avg.length?avg.reduce((s,v)=>s+v,0)/avg.length:8;return `<div class="hero"><div><h2>Récupération</h2><div class="muted">Saisie rapide quotidienne et tendances 7 / 28 jours.</div></div></div><div class="grid g4"><div class="card kpi"><div class="label">Sommeil 7 j</div><div class="value">${a.toFixed(1)} h</div></div><div class="card kpi"><div class="label">Fatigue</div><div class="value">${last?.fatigue??'—'}/10</div></div><div class="card kpi"><div class="label">Stress</div><div class="value">${last?.stress??'—'}/10</div></div><div class="card kpi"><div class="label">Récupération</div><div class="value">${last?Math.round((10-last.fatigue)*5+(10-last.stress)*3+last.motivation*2):'—'}/100</div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="section-title">Check-in express</div><div class="form two"><label>Sommeil (h)<input id="sleep" type="number" step="0.1" placeholder="8"></label><label>Fatigue /10<input id="fatigue" type="number" min="0" max="10" placeholder="2"></label><label>Stress /10<input id="stress" type="number" min="0" max="10" placeholder="2"></label><label>Motivation /10<input id="motivation" type="number" min="0" max="10" placeholder="8"></label><button class="btn primary" data-action="saveRecovery">Enregistrer</button></div></div><div class="card">${chart(state.recovery.slice(-14).map(x=>+x.sleep),'Sommeil récent',' h')}</div></div>`}
function trajectory(){return `<div class="hero"><div><h2>Trajectoire</h2><div class="muted">156 semaines · cycles de 6 semaines · déload automatique en semaine 6 de chaque cycle.</div></div></div><div class="card"><div class="bar"><i style="width:${state.week/156*100}%"></i></div><div class="row" style="justify-content:space-between;margin-top:7px"><span>S1</span><b>S${state.week}</b><span>S156</span></div></div><div class="timeline" style="margin-top:14px">${phases.map(p=>`<div class="timeline-item card"><b>S${p.from}–${p.to}</b><div><b>${p.name}</b><p class="muted">${p.focus} · ${p.kcal} kcal · P ${p.p} / L ${p.f} / G ${p.c}</p></div></div>`).join('')}</div>`}
function milestones(){let ms=[[6,'Fin cycle 1','Technique, tests mobilité, mensurations'],[12,'Fin hypertrophie I','PRs + composition corporelle'],[52,'Checkpoint 1 an','Bilan complet et recalage nutrition'],[104,'Checkpoint 2 ans','Performance + esthétique'],[156,'Fin du projet','Bilan complet et nouveau cycle']];return `<div class="hero"><div><h2>Jalons</h2><div class="muted">Checkpoints qui déclenchent une réévaluation automatique du projet.</div></div></div><div class="grid g3">${ms.map(x=>`<div class="card"><span class="tag">Semaine ${x[0]}</span><h3>${x[1]}</h3><p class="muted">${x[2]}</p><button class="btn" data-week="${x[0]}">${state.week===x[0]?'Semaine actuelle':'Aller à la semaine'}</button></div>`).join('')}</div>`}

Id('prValue')?.focus()});document.querySelectorAll('[data-addname]').forEach(b=>b.onclick=()=>{let s=document.getElementById('prName');if(s){s.value=decodeURIComponent(b.dataset.addname);document.getElementById('prValue').focus()}});document.querySelectorAll('[data-editpr]').forEach(b=>b.onclick=()=>editPR(b.dataset.editpr));document.querySelector('[data-action="saveSettings"]')?.addEventListener('click',()=>{state.settings.height=+document.getElementById('height').value;save();toast('Réglages enregistrés')});document.querySelector('[data-action="export"]')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project-physique-156-backup.json';a.click();URL.revokeObjectURL(a.href)});document.getElementById('importFile')?.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state=x;save();render();toast('Sauvegarde importée')}catch(err){alert('JSON invalide')}};r.readAsText(f)});document.querySelector('[data-action="reset"]')?.addEventListener('click',()=>{if(confirm('Réinitialiser toutes les données ?')){localStorage.removeItem(KEY);location.reload()}});document.querySelector('[data-action="timerStart"]')?.addEventListener('click',()=>{if(!timerStart)timerStart=Date.now();clearInterval(timerInt);timerInt=setInterval(updateTimer,1000)});document.querySelector('[data-action="timerStop"]')?.addEventListener('click',()=>clearInterval(timerInt));document.querySelector('[data-action="timerReset"]')?.addEventListener('click',()=>{clearInterval(timerInt);timerStart=0;let t=document.getElementById('timer');if(t)t.textContent='00:00:00'});document.querySelector('[data-action="finishSession"]')?.addEventListener('click',()=>{let sec=timerStart?Math.round((Date.now()-timerStart)/1000):0;state.sessionLogs[state.week+'-'+state.day]={duration:sec?Math.round(sec/60):75,date:new Date().toISOString()};save();toast('Séance enregistrée');clearInterval(timerInt);timerStart=0});}
function updateTimer(){let t=document.getElementById('timer');if(!t||!timerStart)return;let s=Math.floor((Date.now()-timerStart)/1000),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),x=String(s%60).padStart(2,'0');t.textContent=`${h}:${m}:${x}`}

  function dateForSelection(){let d=new Date(PROGRAM_START);d.setDate(d.getDate()+(state.week-1)*7+(state.day-1));return d}
  function fmtDate(d){return new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'2-digit',month:'short'}).format(d).replace(/\./g,'')}
  function dateISO(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
  function setByDate(v){let d=new Date(v+'T12:00:00');if(isNaN(d))return;let diff=Math.floor((d-PROGRAM_START)/86400000);state.week=Math.max(1,Math.min(156,Math.floor(diff/7)+1));state.day=((d.getDay()+6)%7)+1;save();render()}
  function shareText(title,text){let url=location.href;let full=title+'\n'+text+'\n'+url;if(navigator.share){navigator.share({title,text:full}).catch(()=>{})}else{let host=document.getElementById('modalHost');host.innerHTML=`<div class="overlay show" data-share-close></div><div class="card share-modal"><h3>Partager</h3><p class="muted">Choisis l’application à utiliser.</p><div class="grid g2"><a class="btn primary" target="_blank" href="https://wa.me/?text=${encodeURIComponent(full)}">WhatsApp</a><a class="btn blue" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}">Messenger / Facebook</a><button class="btn" id="copyShare">Copier le message</button><button class="btn" data-share-close>Fermer</button></div></div>`;host.querySelectorAll('[data-share-close]').forEach(x=>x.onclick=()=>host.innerHTML='');host.querySelector('#copyShare').onclick=()=>navigator.clipboard?.writeText(full).then(()=>toast('Message copié'))}}
  function timerPanel(){return state.timerOpen?`<div class="timer-panel card"><div class="row" style="justify-content:space-between"><div><b>Chronos</b><span class="muted mini">type Tabata / séance</span></div><button class="btn" data-action="toggleTimers">×</button></div><div class="timer-tabs"><button class="btn active" data-tmode="simple">Simple</button><button class="btn" data-tmode="countdown">Compte à rebours</button><button class="btn" data-tmode="interval">Prépa / Exercice / Repos</button></div><div id="timerBody"></div></div>`:''}
  function renderTimerBody(){let h=document.getElementById('timerBody');if(!h)return;let mode=state.timerMode||'simple';if(mode==='simple'){h.innerHTML=`<div class="big-timer" id="simpleDisplay">${fmtClock(state.simpleSec||0)}</div><div class="row"><button class="btn primary" data-action="simpleStart">Démarrer</button><button class="btn" data-action="simplePause">Pause</button><button class="btn" data-action="simpleReset">Reset</button></div>`}

  function training(){let code=dayInfo()[2],cp=cycleParams(),d=dateForSelection();let total=weekInCycle()===6?60:80;if(code==='R')return `<div class="hero"><div><h2>Entraînement</h2><div class="muted">${fmtDate(d)} · récupération active</div></div></div>${dateControls()}<div class="card" style="margin-top:14px"><h3>Récupération active</h3><p>30–45 min de marche facile, respiration nasale si confortable, puis 15 min de mobilité globale. Intensité volontairement basse.</p><a class="video" target="_blank" href="${youtube('zone 2 walking recovery')}">▶ Voir une démonstration</a></div>`;let rows=scaledExercises(code);return `<div class="hero"><div><h2>Entraînement</h2><div class="muted">${fmtDate(d)} · ${sessionNames[code]} · cible ${total}–90 min</div></div><button class="btn blue" data-action="toggleTimers">⏱ Chronos</button></div>${dateControls()}<div class="card rule-card" style="margin-top:14px"><div class="section-title">Règles de progression — à appliquer avant de commencer</div><div class="rule-grid"><div><b>1 · Valider</b><p>Atteindre le haut de la fourchette sur toutes les séries avec la RIR cible et une technique propre.</p></div><div><b>2 · Augmenter</b><p>Haut du corps +2,5 kg ; bas du corps +5 kg ; haltères +1 à 2 kg lorsque la progression est validée.</p></div><div><b>3 · Stabiliser</b><p>Si les reps sont dans la fourchette mais pas au sommet, conserver la charge et chercher à gagner des reps.</p></div><div><b>4 · Réduire</b><p>Sous la fourchette ou RIR 0 : réduire de 2,5 à 5 % à la prochaine exposition.</p></div><div><b>5 · Cycle 6 semaines</b><p>S1–2 accumulation, S3–4 intensification, S5 surcharge contrôlée, S6 déload avec volume réduit.</p></div></div></div><div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><div><span class="tag">Cycle ${cycle()}</span><span class="tag">Semaine ${weekInCycle()}/6</span><span class="tag">${phase().name}</span></div><b>RIR cible ${cp.rir}</b></div><div class="block-title"><span></span><b>1 · Mobilité — 8 min</b></div><div class="session">${warm.slice(0,2).map(e=>exerciseRow(e,true)).join('')}</div><div class="block-title"><span></span><b>2 · Warm-up — 10 min</b></div><div class="session">${warm.slice(2).map(e=>exerciseRow(e,true)).join('')}</div><div class="block-title"><span></span><b>3 · Bloc principal — ${code==='E'?'25–30':'30–35'} min</b></div><div class="session">${rows.slice(0,2).map(e=>exerciseRow(e)).join('')}</div><div class="block-title"><span></span><b>4 · Accessoires — 15–25 min</b></div><div class="session">${rows.slice(2).map(e=>exerciseRow(e)).join('')}</div><div class="block-title"><span></span><b>5 · Retour au calme — 5–8 min</b></div><div class="session">${cool.map(e=>exerciseRow(e,true)).join('')}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" data-action="finishSession">Enregistrer la séance</button></div></div>`}

  function nutrition(){let p=phase(),train=dayInfo()[2]!=='R',target=train?p.kcal:p.kcal-250,d=dateForSelection();let meals=[['Petit-déjeuner','Avoine 60 g · œufs 3 · skyr 150 g · fruits rouges 100 g','≈ 600 kcal'],['Déjeuner','Poulet 180 g · riz cuit 250 g · légumes 200 g · huile 10 g','≈ 700 kcal'],['Collation','Whey 30 g · banane · 3 galettes de riz','≈ 350 kcal'],['Dîner','Saumon 170 g · pommes de terre 300 g · légumes 250 g · huile 10 g','≈ 650 kcal']];let shop=['Poulet','Saumon','Œufs','Skyr','Whey','Avoine','Riz','Pommes de terre','Légumes','Fruits rouges','Bananes','Huile d’olive'];return `<div class="hero"><div><h2>Nutrition</h2><div class="muted">${fmtDate(d)} · ${train?'Jour entraînement':'Jour repos'} · ${p.name}</div></div><span class="pill">${target} kcal · P ${p.p} g · L ${p.f} g · G ${train?p.c:Math.max(180,p.c-55)} g</span></div>${nutritionDateControls()}<div class="grid g3" style="margin-top:14px"><div class="card kpi"><div class="label">Calories cible</div><div class="value">${target}</div></div><div class="card kpi"><div class="label">Protéines</div><div class="value">${p.p} g</div></div><div class="card kpi"><div class="label">Hydratation</div><div class="value">2–3 L</div><div class="sub">À répartir sur la journée</div></div></div><div class="card" style="margin-top:14px"><div class="section-title">Menu automatique du ${fmtDate(d)}</div>${meals.map((m,i)=>`<div class="session"><div class="row" style="justify-content:space-between"><div><b>${m[0]}</b><p class="muted" style="margin:4px 0">${m[1]}</p></div><span class="tag">${m[2]}</span></div><label class="check"><input type="checkbox" data-meal="${i}" ${state.mealChecks[i]?'checked':''}> Consommé</label></div>`).join('')}</div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="section-title">Règle automatique 14 jours</div><p>Comparer moyenne de poids, tour de taille et performances. Poids stable + performances stables → +100 à +150 kcal. Hausse trop rapide du poids/taille → −100 à −150 kcal. Protéines maintenues.</p><div class="section-title" style="margin-top:16px">Historique nutrition</div>${chart((state.measureHistory||[]).slice(-10).map(x=>+x.weight).filter(Boolean),'Poids vs plan',' kg')}</div><div class="card"><div class="row" style="justify-content:space-between"><div class="section-title" style="margin:0">Liste de courses</div><div class="row"><button class="btn" data-shop-view="day">Jour</button><button class="btn" data-shop-view="week">Semaine</button><button class="btn primary" data-action="shareShop">Partager</button></div></div><p class="muted mini">${state.shopView==='week'?'Quantités agrégées pour la semaine sélectionnée':'Quantités nécessaires pour cette journée'}</p>${shop.map((x,i)=>`<label class="check"><input type="checkbox" data-shop="${i}" ${state.shopChecks[i]?'checked':''}> ${x} ${state.shopView==='week'?'· quantité hebdomadaire':'· quantité du jour'}</label>`).join('')}</div></div>`}

strong>${s}${s==='—'?'':'/100'}</strong></button>`}).join('')}</div></div></div><div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${z}</h3><p class="muted">${mobilityDescriptions[z]||p.desc} · unité ${p.unit}</p></div><button class="btn primary" data-action="mobProtocol">▶ Lancer</button></div><div class="form two" style="margin-top:12px"><label>Résultat (${p.unit})<input id="mobInput" type="number" step="0.1" placeholder="Mesure"></label><div class="row" style="align-items:end"><button class="btn primary" data-action="saveMob">Enregistrer</button></div></div><div class="section-title" style="margin-top:18px">Protocole détaillé</div>${p.moves.map((m,i)=>`<div class="session"><div class="row" style="justify-content:space-between"><div><b>${i+1}. ${m[0]}</b><p class="muted">${mobilityDescriptions[z]||p.desc}</p><div class="exercise-meta"><span>Durée <b>${m[1]}</b></span><span>Tempo <b>${m[2]}</b></span><span>Repos <b>${fmtRest(m[3])}</b></span></div><div class="exercise-note">${m[4]}</div></div><a class="btn blue" target="_blank" href="${youtube(m[5])}">▶ Vidéo + consignes</a></div></div>`).join('')}</div>`}
  function settings(){return `<div class="hero"><div><h2>Réglages</h2><div class="muted">Données locales · programmation activable après import.</div></div></div><div class="grid g2"><div class="card"><div class="section-title">Profil</div><div class="form two"><label>Taille (cm)<input id="height" type="number" value="${state.settings.height}"></label><label>Poids de référence<input id="refweight" type="number" value="${state.weight}"></label><button class="btn primary" data-action="saveSettings">Enregistrer</button></div></div><div class="card"><div class="section-title">Nouvelle programmation</div><p class="muted">Importe un fichier JSON de programmation. Elle est d’abord préparée, puis activée avec le bouton <b>Lancer la nouvelle programmation</b> afin de conserver le calage lundi → dimanche.</p><div class="row"><label class="btn blue">Importer une programmation<input id="programFile" type="file" accept="application/json" hidden></label><button class="btn primary ${state.pendingProgram?'':'hidden'}" data-action="launchProgram">▶ Lancer la nouvelle programmation</button></div>${state.pendingProgram?'<p class="notice" style="margin-top:10px">Nouvelle programmation prête à être activée.</p>':''}</div><div class="card"><div class="section-title">Sauvegarde complète</div><div class="row"><button class="btn primary" data-action="export">Exporter JSON</button><label class="btn">Importer sauvegarde<input id="importFile" type="file" accept="application/json" hidden></label></div></div><div class="card"><div class="section-title">Réinitialisation</div><button class="btn danger" data-action="reset">Réinitialiser toutes les données</button></div></div>`}

  function bind(){

  function bindTimers(){

  function intervalTick(){let phase=state.ivPhase,left=state.ivLeft||0;let label=phase==='prep'?'PRÉPARATION':phase==='work'?'EXERCICE':'REPOS';let d=document.getElementById('ivDisplay'),t=document.getElementById('ivTime');if(d)d.textContent=`${label} · cycle ${state.ivCycle}/${state.ivCycles}`;if(t)t.textContent=fmtClock(left);if(left<=0){if(phase==='prep'){state.ivPhase='work';state.ivLeft=state.ivWork}else if(phase==='work'){if(state.ivRest>0){state.ivPhase='rest';state.ivLeft=state.ivRest}else{advanceCycle();}}else{advanceCycle()}return}state.ivLeft--;if(t)t.textContent=fmtClock(state.ivLeft)}

  function openCalendar(){let h=document.getElementById('modalHost');if(!h)return;let d=dateForSelection();h.innerHTML=`<div class="overlay show" style="z-index:80" data-modal-close></div><div class="card calendar-modal"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Choisir le jour</h3><button class="btn" data-modal-close>×</button></div><p class="muted">Utilise le petit calendrier : aucun besoin de taper la date.</p><div class="form"><label>Date<input id="datePick" type="date" value="${dateISO(d)}"></label><button class="btn" id="applyDate">Afficher cette journée</button><button class="btn primary" id="modalToday">Aujourd’hui</button></div></div>`;h.querySelectorAll('[data-modal-close]').forEach(x=>x.onclick=()=>h.innerHTML='');h.querySelector('#applyDate').onclick=()=>{setByDate(h.querySelector('#datePick').value);h.innerHTML=''};h.querySelector('#modalToday').onclick=()=>{setByDate(dateISO(new Date()));h.innerHTML=''}}
  function openTestProtocol(){let zones=Object.keys(mobilityProtocols),i=0,h=document.getElementById('modalHost');const show=()=>{let z=zones[i],p=mobilityProtocols[z],desc=mobilityDescriptions[z]||p.desc;h.innerHTML=`<div class="overlay show" style="z-index:80"></div><div class="card protocol-modal"><div class="row" style="justify-content:space-between"><div><span class="tag">Test ${i+1}/${zones.length}</span><h3 style="margin:7px 0">${z}</h3></div><button class="btn" id="closeTest">×</button></div><div class="protocol-visual"><div class="pose-icon">${z==='Cheville'?'🦶':z==='Épaule'?'🏋️':'◉'}</div><div><b>Comment faire</b><p>${desc}</p><a class="btn blue" target="_blank" href="${youtube(p.test)}">▶ Vidéo de démonstration</a></div></div><div class="notice"><b>Critère :</b> mouvement lent, amplitude active contrôlée, pas de compensation ni douleur.</div><div class="row" style="justify-content:flex-end;margin-top:14px">${i?'<button class="btn" id="prevTest">‹ Précédent</button>':''}<button class="btn primary" id="nextTest">${i===zones.length-1?'Terminer':'Suivant ›'}</button></div></div>`;h.querySelector('#closeTest').onclick=()=>h.innerHTML='';h.querySelector('#nextTest').onclick=()=>{if(i===zones.length-1){h.innerHTML='';toast('Test mobilité terminé');return}i++;show()};h.querySelector('#prevTest')?.addEventListener('click',()=>{i--;show()})};show()}

  function training(){let code=dayInfo()[2],cp=cycleParams(),d=dateForSelection(),total=weekInCycle()===6?65:85;if(code==='R')return `<div class="hero"><div><h2>Entraînement</h2><div class="muted">${fmtDate(d)} · récupération active</div></div></div>${dateControls()}<div class="card" style="margin-top:14px"><h3>Récupération active</h3><p>30–45 min de marche facile + 15 min de mobilité active. Intensité basse, respiration contrôlée, aucune série à l'échec.</p><a class="video" target="_blank" href="${youtube('zone 2 walking recovery mobility')}">▶ Démonstration</a></div>`;let rows=scaledExercises(code);return `<div class="hero"><div><h2>Entraînement</h2><div class="muted">${fmtDate(d)} · ${sessionNames[code]} · ${phase().name} · cible ${total}–90 min</div></div><button class="btn blue" data-action="toggleTimers">⏱ Chronos</button></div>${dateControls()}<div class="card rule-card" style="margin-top:14px"><div class="section-title">Règles automatiques — à lire avant la séance</div><div class="rule-grid"><div><b>Valider</b><p>Haut de fourchette sur toutes les séries, RIR cible respectée, technique stable.</p></div><div><b>+ charge</b><p>Haut du corps +2,5 kg · bas du corps +5 kg · haltères +1–2 kg.</p></div><div><b>+ reps</b><p>Si le sommet n'est pas atteint, garde la charge et gagne des reps à la prochaine exposition.</p></div><div><b>− charge</b><p>Sous la fourchette ou RIR 0 : −2,5 à −5 %.</p></div><div><b>Cycle 6 semaines</b><p>S1–2 accumulation · S3–4 intensification · S5 surcharge · S6 déload.</p></div></div></div><div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><div><span class="tag">Cycle ${cycle()}</span><span class="tag">S${weekInCycle()}/6</span><span class="tag">${phase().name}</span></div><b>RIR cible ${cp.rir}</b></div><div class="block-title"><span></span><b>1 · Mobilité — 8 min</b></div><p class="muted mini">Active range : contrôler les articulations utiles à la séance, sans forcer en fin d'amplitude.</p><di   function bindTimersV3(){document.querySelector('[data-action="simpleStart"]')?.addEventListener('click',()=>{clearInterval(window._simpleInt);window._simpleInt=setInterval(()=>{state.simpleSec=(state.simpleSec||0)+1;let e=document.getElementById('simpleDisplay');if(e)e.textContent=fmtClock(state.simpleSec)},1000)});document.querySelector('[data-action="simplePause"]')?.addEventListener('click',()=>clearInterval(window._simpleInt));document.querySelector('[data-action="simpleReset"]')?.addEventListener('click',()=>{clearInterval(window._simpleInt);state.simpleSec=0;renderTimerBody()});document.querySelector('[data-action="cdStart"]')?.addEventListener('click',()=>{if(!state.cdLeft)state.cdTotal=(+document.getElementById('cdMin').value||0)*60+(+document.getElementById('cdSec').value||0),state.cdLeft=state.cdTotal;clearInterval(window._cdInt);window._cdInt=setInterval(()=>{state.cdLeft=Math.max(0,state.cdLeft-1);let e=document.getElementById('cdDisplay');if(e)e.textContent=fmtClock(state.cdLeft);if(state.cdLeft<=0){clearInterval(window._cdInt);toast('Compte à rebours terminé')}},1000)});document.querySelector('[data-action="cdPause"]')?.addEventListener('click',()=>clearInterval(window._cdInt));document.querySelector('[data-action="cdReset"]')?.addEventListener('click',()=>{clearInterval(window._cdInt);state.cdLeft=0;renderTimerBody()});document.querySelector('[data-action="ivStart"]')?.addEventListener('click',()=>{state.ivCyclesDef=[...document.querySelectorAll('.cycle-row')].map((r,i)=>({prep:+r.querySelector('[data-ivfield="prep"]').value||0,work:+r.querySelector('[data-ivfield="work"]').value||1,rest:+r.querySelector('[data-ivfield="rest"]').value||0}));state.ivCycle=1;state.ivPhase='prep';state.ivLeft=state.ivCyclesDef[0].prep;clearInterval(window._ivInt);window._ivInt=setInterval(timerIntervalTick,1000);timerIntervalTick()});document.querySelector('[data-action="ivPause"]')?.addEventListener('click',()=>clearInterval(window._ivInt));document.querySelector('[data-action="ivReset"]')?.addEventListener('click',()=>{clearInterval(window._ivInt);state.ivCycle=1;state.ivPhase='prep';state.ivLeft=0;renderTimerBody()});document.querySelector('[data-action="addCycle"]')?.addEventListener('click',()=>{state.ivCyclesDef=state.ivCyclesDef||[];let last=state.ivCyclesDef.at(-1)||{prep:10,work:40,rest:20};state.ivCyclesDef.push({...last});renderTimerBody()});document.querySelectorAll('[data-action="removeCycle"]').forEach(b=>b.onclick=()=>{state.ivCyclesDef.splice(+b.dataset.i,1);renderTimerBody()});document.querySelectorAll('[data-ivfield]').forEach(i=>i.onchange=()=>{let a=state.ivCyclesDef||[];a[+i.dataset.i][i.dataset.ivfield]=+i.value||0;state.ivCyclesDef=a;save()})}
  function shareText(title,text){let url=location.href,full=`${title}\n${text}\n${url}`,encoded=encodeURIComponent(full);let host=document.getElementById('modalHost');host.innerHTML=`<div class="overlay show" data-share-close></div><div class="card share-modal"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Partager</h3><button class="btn" data-share-close>×</button></div><p class="muted">Choisis le canal de partage. Le bouton natif ouvre directement le menu de partage de l'appareil.</p><div class="share-grid"><button class="share-btn primary" id="nativeShare">Partager sur l'appareil</button><a class="share-btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encoded}">WhatsApp</a><a class="share-btn" href="fb-messenger://share/?link=${encodeURIComponent(url)}&app_id=123456789">Messenger</a><a class="share-btn" target="_blank" rel="noopener" href="https://www.facebook.com/dialog/send?link=${encodeURIComponent(url)}&redirect_uri=${encodeURIComponent(url)}">Messenger / Facebook</a><button class="share-btn" id="copyShare">Copier le message</button></div></div>`;host.querySelectorAll('[data-share-close]').forEach(x=>x.onclick=()=>host.innerHTML='');host.querySelector('#nativeShare')?.addEventListener('click',()=>{if(navigator.share)navigator.share({title,text:full}).catch(()=>{});else toast('Le partage natif n’est pas disponible sur cet appareil')});host.querySelector('#copyShare')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(full);toast('Message copié')}catch{toast('Copie non disponible')};})}
  function openTestProtocol(){let zones=Object.keys(mobilityProtocols),i=0,h=document.getElementById('modalHost');const show=()=>{let z=zones[i],p=mobilityProtocols[z];h.innerHTML=`<div class="overlay show" data-protocol-close></div><div class="card protocol-modal"><div class="row" style="justify-content:space-between"><div><span class="tag">Test ${i+1}/${zones.length}</span><h3 style="margin:7px 0">${z}</h3></div><button class="btn" data-protocol-close>×</button></div><div class="protocol-visual"><div class="pose-icon">${z==='Cheville'?'🦶':z==='Épaule'?'◉':'↻'}</div><div><b>Consignes</b><p>${esc(mobilityDescriptions[z]||p.desc)}</p><a class="btn blue" target="_blank" rel="noopener" href="${youtube(p.test)}">▶ Vidéo repère</a></div></div><div class="notice"><b>Règle :</b> mouvement lent, amplitude active contrôlée, aucune compensation volontaire, pas de douleur.</div><div class="row" style="justify-content:flex-end;margin-top:14px">${i?'<button class="btn" id="prevTest">‹ Précédent</button>':''}<button class="btn primary" id="nextTest">${i===zones.length-1?'Terminer':'Suivant ›'}</button></div></div>`;h.querySelectorAll('[data-protocol-close]').forEach(x=>x.onclick=()=>h.innerHTML='');h.querySelector('#nextTest').onclick=()=>{if(i===zones.length-1){h.innerHTML='';toast('Test mobilité terminé');return}i++;show()};h.querySelector('#prevTest')?.addEventListener('click',()=>{i--;show()})};show()}
  function openProtocol(zone){let p=mobilityProtocols[zone],i=0,h=document.getElementById('modalHost');const show=()=>{let m=p.moves[i],desc=mobilityDescriptions[zone]||p.desc;h.innerHTML=`<div class="overlay show" data-protocol-close></div><div class="card protocol-modal"><div class="row" style="justify-content:space-between"><div><span class="tag">${zone}</span><h3 style="margin:7px 0">${i+1}/${p.moves.length} · ${m[0]}</h3></div><button class="btn" data-protocol-close>×</button></div><div class="protocol-visual"><div class="pose-icon">◉</div><div><b>Exécution</b><p>${esc(desc)}</p><p class="muted mini">Réalise l'amplitude lentement. Garde le bassin et les côtes contrôlés. Cherche la qualité du mouvement plutôt que la profondeur maximale.</p><a class="btn blue" target="_blank" rel="noopener" href="${youtube(m[5])}">▶ Vidéo</a></div></div><div class="exercise-meta"><span>Durée ${m[1]}</span><span>Tempo ${m[2]}</span><span>Repos ${formatSeconds(m[3])}</span></div><div class="notice"><b>Intention :</b> ${esc(m[4])}</div><div class="row" style="justify-content:flex-end;margin-top:14px">${i?'<button class="btn" id="protoPrev">‹ Précédent</button>':''}<button class="btn primary" id="protoNext">${i===p.moves.length-1?'Terminer':'Suivant ›'}</button></div></div>`;h.querySelectorAll('[data-protocol-close]').forEach(x=>x.onclick=()=>{clearInterval(window.protoInt);h.innerHTML=''});h.querySelector('#protoNext').onclick=()=>{if(i===p.moves.length-1){clearInterval(window.protoInt);h.innerHTML='';toast('Protocole terminé');return}i++;show()};h.querySelector('#protoPrev')?.addEventListener('click',()=>{i--;show()})};show()}
  function settings(){return `<div class="hero"><div><h2>Réglages</h2><div class="muted">Données locales, sauvegarde et gestion de la programmation.</div></div></div><div class="grid g2"><div class="card"><div class="section-title">Profil</div><div class="form two"><label>Taille (cm)<input id="height" type="number" value="${state.settings.height}"></label><label>Poids de référence<input id="refweight" type="number" value="${state.weight}"></label><button class="btn primary" data-action="saveSettings">Enregistrer</button></div></div><div class="card"><div class="section-title">Programmation</div><p class="muted">Importe un fichier JSON de programmation. Elle reste en attente tant que tu n'as pas lancé son activation.</p><div class="row"><label class="btn primary">Importer une programmation<input id="programFile" type="file" accept="application/json" hidden></label>${state.pendingProgram?'<button class="btn primary" data-action="launchProgram">▶ Lancer la nouvelle programmation</button>':'<span class="tag">Aucune programmation en attente</span>'}</div></div><div class="card"><div class="section-title">Sauvegarde</div><div class="row"><button class="btn primary" data-action="export">Exporter JSON</button><label class="btn">Importer sauvegarde<input id="importFile" type="file" accept="application/json" hidden></label></div><p class="muted">La sauvegarde contient les données de suivi. Fais-en une copie régulièrement.</p></div><div class="card"><div class="section-title">Réinitialisation</div><button class="btn danger" data-action="reset">Réinitialiser toutes les données</button></div></div>`}
  function bindV3(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.page=b.dataset.nav;state.menu=false;save();render()});document.querySelector('[data-action="menu"]')?.addEventListener('click',()=>{state.menu=!state.menu;render()});document.querySelectorAll('[data-action="close"]').forEach(x=>x.onclick=()=>{state.menu=false;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;state.calendarOpen=false;save();render()});document.getElementById('weekSelect')?.addEventListener('change',e=>{state.week=+e.target.value;save();render()});document.querySelectorAll('[data-action="today"]').forEach(b=>b.onclick=()=>{setByDate(dateISO(new Date()))});document.querySelector('[data-action="calendar"]')?.addEventListener('click',()=>{state.calendarOpen=!state.calendarOpen;state.calCursor=dateISO(new Date(dateForSelection().getFullYear(),dateForSelection().getMonth(),1));render()});document.querySelectorAll('[data-calprev]').forEach(b=>b.onclick=()=>{{let d=new Date((state.calCursor||dateISO(dateForSelection()))+'T12:00:00');d.setMonth(d.getMonth()-1);state.calCursor=dateISO(new Date(d.getFullYear(),d.getMonth(),1));render()}});document.querySelectorAll('[data-calnext]').forEach(b=>b.onclick=()=>{{let d=new Date((state.calCursor||dateISO(dateForSelection()))+'T12:00:00');d.setMonth(d.getMonth()+1);state.calCursor=dateISO(new Date(d.getFullYear(),d.getMonth(),1));render()}});document.querySelectorAll('[data-pickdate]').forEach(b=>b.onclick=()=>{setByDate(b.dataset.pickdate);state.calendarOpen=false});document.querySelector('[data-cal-today]')?.addEventListener('click',()=>{setByDate(dateISO(new Date()));state.calendarOpen=false});document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{state.selectedZone=b.dataset.zone;save();render()});document.querySelector('[data-action="saveMob"]')?.addEventListener('click',()=>{let v=+document.getElementById('mobInput').value;if(Number.isFinite(v)){let z=state.selectedZone||'Cheville';state.mobility[z]=Math.max(0,Math.min(100,Math.round(v)));state.mobHistory.push({date:new Date().toISOString(),score:state.mobility[z],zone:z});save();render()}});document.querySelector('[data-action="mobProtocol"]')?.addEventListener('click',()=>openProtocol(state.selectedZone||'Cheville'));document.querySelector('[data-action="startMobTest"]')?.addEventListener('click',openTestProtocol);document.querySelector('[data-action="saveBody"]')?.addEventListener('click',()=>{document.querySelectorAll('[data-measure]').forEach(i=>state.measures[i.dataset.measure]=+i.value);state.weight=+document.getElementById('weight').value;state.bf=+document.getElementById('bf').value;save();render()});document.querySelector('[data-action="snapshot"]')?.addEventListener('click',()=>{state.measureHistory.push({date:new Date().toISOString(),weight:state.weight,bf:state.bf,...state.measures});save();render()});document.querySelectorAll('[data-bside]').forEach(b=>b.onclick=()=>{state.bodySide=b.dataset.bside;render()});document.querySelectorAll('[data-bzone]').forEach(b=>b.onclick=()=>{state.bodyGraph=b.dataset.bzone;render()});document.querySelector('.graph-select[data-graph-scope="body"]')?.addEventListener('change',e=>{state.bodyGraph=e.target.value;save();render()});document.querySelector('.graph-select[data-graph-scope="recovery"]')?.addEventListener('change',e=>{state.recoveryGraph=e.target.value;save();render()});document.querySelector('.graph-select[data-graph-scope="mobility"]')?.addEventListener('change',e=>{state.mobilityGraph=e.target.value;save();render()});document.getElementById('prGraph')?.addEventListener('change',e=>{state.prGraph=e.target.value;save();render()});document.querySelector('[data-action="saveRecovery"]')?.addEventListener('click',()=>{let vals=['sleep','fatigue','stress','motivation'].map(id=>+document.getElementById(id).value);if(vals.every(Number.isFinite)){state.recovery.push({date:new Date().toISOString(),sleep:vals[0],fatigue:vals[ ;document.querySelector('[data-action="saveSettings"]')?.addEventListener('click',()=>{state.settings.height=+document.getElementById('height').value||state.settings.height;save();toast('Réglages enregistrés')});document.querySelector('[data-action="export"]')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project-physique-156-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});document.getElementById('importFile')?.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state={...state,...x};save();render();toast('Sauvegarde importée')}catch(err){alert('JSON invalide')}};r.readAsText(f)});document.getElementById('programFile')?.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state.pendingProgram=JSON.parse(r.result);save();render();toast('Programmation prête : lance-la quand tu veux')}catch(err){alert('Programmation JSON invalide')}};r.readAsText(f)});document.querySelector('[data-action="launchProgram"]')?.addEventListener('click',()=>{if(!state.pendingProgram)return;let p=state.pendingProgram;Object.keys(p).forEach(k=>{if(!['week','day','pendingProgram'].includes(k))state[k]=p[k]});state.week=1;state.day=1;state.programStartedAt=new Date().toISOString();state.pendingProgram=null;state.calendarOpen=false;save();toast('Nouvelle programmation lancée et calée sur lundi');render()})}
