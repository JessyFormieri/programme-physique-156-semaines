<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Programme Physique — 156 semaines</title>

<style>
:root{
--bg:#f3f4f6;
--card:#fff;
--text:#111827;
--muted:#6b7280;
--line:#e5e7eb;
--accent:#2563eb;
--good:#15803d;
--warn:#b45309;
--danger:#b91c1c
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
background:var(--bg);
color:var(--text)
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.top{
position:sticky;
top:0;
z-index:20;
background:#111827;
color:#fff;
padding:14px 18px;
box-shadow:0 2px 10px #0002
}

.topin{
max-width:1250px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.brand{
font-weight:800;
font-size:18px
}

.sub{
font-size:12px;
color:#cbd5e1
}

.container{
max-width:1250px;
margin:0 auto;
padding:22px 18px 95px
}

nav{
display:flex;
gap:6px;
overflow:auto;
padding:3px;
margin-bottom:20px
}

nav button{
border:1px solid var(--line);
background:var(--card);
color:var(--text);
padding:10px 13px;
border-radius:10px;
white-space:nowrap
}

nav button.active{
background:var(--accent);
color:#fff;
border-color:var(--accent)
}

.page{display:none}

.page.active{display:block}

h1{
font-size:28px;
margin:0 0 6px
}

h2{
font-size:21px;
margin:0 0 12px
}

h3{
font-size:16px;
margin:0 0 8px
}

.muted{color:var(--muted)}

.grid{
display:grid;
gap:14px
}

.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
padding:16px;
box-shadow:0 1px 2px #00000008
}

.stat{
font-size:28px;
font-weight:800
}

.small{font-size:12px}

.row{
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap
}

.between{justify-content:space-between}

.btn{
border:1px solid var(--line);
background:#fff;
border-radius:9px;
padding:9px 13px
}

.btn.primary{
background:var(--accent);
border-color:var(--accent);
color:#fff
}

.btn.danger{
color:#fff;
background:var(--danger);
border-color:var(--danger)
}

label{
display:block;
font-size:12px;
font-weight:700;
margin:0 0 5px
}

.field{
min-width:110px;
flex:1
}

input,select,textarea{
width:100%;
border:1px solid #d1d5db;
border-radius:8px;
padding:9px;
background:#fff;
color:var(--text)
}

textarea{
min-height:80px;
resize:vertical
}

table{
width:100%;
border-collapse:collapse
}

th,td{
padding:9px 7px;
border-bottom:1px solid var(--line);
text-align:left;
vertical-align:middle
}

th{
font-size:12px;
color:var(--muted)
}

td input{
min-width:70px;
padding:7px
}

.badge{
display:inline-block;
border-radius:999px;
padding:4px 8px;
font-size:11px;
font-weight:700;
background:#e5e7eb
}

.badge.blue{
background:#dbeafe;
color:#1e40af
}

.badge.green{
background:#dcfce7;
color:#166534
}

.badge.orange{
background:#ffedd5;
color:#9a3412
}

.hero{
padding:20px;
border-radius:16px;
background:#fff;
border:1px solid var(--line);
margin-bottom:14px
}

.progress{
height:10px;
border-radius:99px;
background:#e5e7eb;
overflow:hidden
}

.progress>i{
display:block;
height:100%;
background:var(--accent)
}

.weekbar{
display:grid;
grid-template-columns:auto 1fr auto;
gap:10px;
align-items:center
}

.weekbar select{
max-width:260px
}

.exercise{
border:1px solid var(--line);
border-radius:12px;
padding:13px;
margin-top:10px;
background:#fff
}

.exercise-title{
font-weight:800
}

.meta{
font-size:12px;
color:var(--muted);
margin-top:3px
}

.sets{
margin-top:10px;
display:grid;
grid-template-columns:42px repeat(3,1fr) 2fr;
gap:6px;
align-items:center
}

.sets>div{
font-size:12px;
color:var(--muted);
font-weight:700
}

.sets input{
min-width:0
}

.mobilebar{
display:none
}

.toast{
position:fixed;
right:18px;
bottom:18px;
background:#111827;
color:#fff;
padding:11px 14px;
border-radius:10px;
z-index:50;
display:none
}

@media(max-width:800px){

.container{
padding:15px 12px 85px
}

.g2,.g3,.g4{
grid-template-columns:1fr 1fr
}

.sets{
grid-template-columns:32px repeat(3,1fr)
}

.sets .noteCell{
grid-column:2/-1
}

.hideMob{
display:none
}

.topin{
align-items:flex-start
}

.brand{
font-size:16px
}

nav{
display:none
}

.mobilebar{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:30;
display:grid;
grid-template-columns:repeat(5,1fr);
background:#fff;
border-top:1px solid var(--line);
box-shadow:0 -2px 12px #0001
}

background:#
