function activityBuckets(range){
  const logs=Object.values(state.sessionLogs||{}).filter(x=>x.date||x.duration);
  const now=new Date(state.date||new Date());
  let labels=[],vals=[];
  if(range==='jours'){
    for(let i=6;i>=0;i--){let d=new Date(now);d.setDate(d.getDate()-i);labels.push(d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.',''));let key=iso(d);vals.push(logs.filter(x=>x.date===key).reduce((a,x)=>a+(+x.duration||0)/60,0));}
  } else if(range==='semaine'){
    for(let i=7;i>=0;i--){let end=new Date(now);end.setDate(end.getDate()-i*7);let start=new Date(end);start.setDate(start.getDate()-6);labels.push('S'+weekNumber(end));vals.push(logs.filter(x=>x.date&&fromIso(x.date)>=start&&fromIso(x.date)<=end).reduce((a,x)=>a+(+x.duration||0)/60,0));}
  } else if(range==='mois'){
    for(let i=5;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1);let end=new Date(d.getFullYear(),d.getMonth()+1,0);labels.push(d.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''));vals.push(logs.filter(x=>x.date&&fromIso(x.date)>=d&&fromIso(x.date)<=end).reduce((a,x)=>a+(+x.duration||0)/60,0));}
  } else {
    for(let i=4;i>=0;i--){let y=now.getFullYear()-i;labels.push(String(y));vals.push(logs.filter(x=>x.date&&fromIso(x.date).getFullYear()===y).reduce((a,x)=>a+(+x.duration||0)/60,0));}
  }
  return {labels,vals};
}
function weekNumber(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));let day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function barGraph(vals,labels,unit='h'){let w=760,h=230,p=34,mx=Math.max(1,...vals),bw=Math.min(52,(w-2*p)/Math.max(1,vals.length)-10);let bars=vals.map((v,i)=>{let x=p+i*((w-2*p)/Math.max(1,vals.length));let bh=(v/mx)*(h-65),y=h-35-bh;return `<rect x="${x+5}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="var(--green)" opacity=".82"/><text x="${x+5+bw/2}" y="${h-14}" text-anchor="middle" fill="var(--muted)" font-size="11">${labels[i]}</text><text x="${x+5+bw/2}" y="${Math.max(14,y-5)}" text-anchor="middle" fill="var(--txt)" font-size="11">${v.toFixed(1)}</text>`}).join('');return `<svg class="graph" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="M${p} ${h-35}H${w-p}" stroke="#233744"/>${bars}<text x="8" y="16" fill="var(--muted)" font-size="11">${unit}</text></svg>`}

function findChart(e){return e.target.closest && e.target.closest('.graph')}
function svgX(svg,clientX){let pt=svg.createSVGPoint();pt.x=clientX;pt.y=0;let ctm=svg.getScreenCTM();if(!ctm)return null;return pt.matrixTransform(ctm.inverse()).x}
function showTip(svg,clientX){let raw=svg.dataset.points;if(!raw)return;let pts;try{pts=JSON.parse(decodeURIComponent(raw))}catch{return}if(!pts.length)return;let x=svgX(svg,clientX);if(x==null)return;let nearest=pts[0],best=Infinity;for(const p of pts){let d=Math.abs(p.x-x);if(d<best){best=d;nearest=p}}let cross=svg.querySelector('.chart-crosshair');if(cross){cross.style.display='';cross.querySelector('.cx-v').setAttribute('x1',nearest.x);cross.querySelector('.cx-v').setAttribute('x2',nearest.x);cross.querySelector('.cx-h').setAttribute('y1',nearest.y);cross.querySelector('.cx-h').setAttribute('y2',nearest.y);cross.querySelector('.cx-pt').setAttribute('cx',nearest.x);cross.querySelector('.cx-pt').setAttribute('cy',nearest.y)}let tip=svg.nextElementSibling;if(tip&&tip.classList.contains('chart-tooltip')){let unit=svg.dataset.unit||'';let d=fromIso(nearest.date);let dl=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});tip.innerHTML=`<b>${nearest.value}${unit?' '+unit:''}</b><span>${dl}</span>`;tip.style.display='block';let vb=svg.viewBox.baseVal;let pctX=(nearest.x/vb.width)*100,pctY=(nearest.y/vb.height)*100;tip.style.left=Math.min(74,Math.max(2,pctX))+'%';tip.style.top=Math.max(2,pctY)+'%'}}
function hideAll(){document.querySelectorAll('.chart-crosshair').forEach(c=>c.style.display='none');document.querySelectorAll('.chart-tooltip').forEach(t=>t.style.display='none')}
document.addEventListener('pointerdown',e=>{let svg=findChart(e);if(!svg){hideAll();return}svg._dragging=true;showTip(svg,e.clientX)});
document.addEventListener('pointermove',e=>{let svg=findChart(e);if(svg&&svg._dragging){e.preventDefault();showTip(svg,e.clientX)}},{passive:false});
document.addEventListener('pointerup',()=>{document.querySelectorAll('.graph').forEach(s=>s._dragging=false)});
document.addEventListener('click',e=>{if(!e.target.closest('.graph')&&!e.target.closest('.chart-tooltip'))hideAll()});
document.addEventListener('change',e=>{if(e.target.matches('[data-range]')){if(!state.chartRange)state.chartRange={};state.chartRange[e.target.dataset.range]=e.target.value;save();render()}else if(e.target.matches('[data-sidefilter]')){state.mobSideFilter=e.target.value;save();render()}});
}
function initSwipeMenu(){
let sx=0,sy=0,tracking=false;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true},{passive:true});
document.addEventListener('touchend',e=>{if(!tracking)return;tracking=false;let t=e.changedTouches[0];if(!t)return;let dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)<50||Math.abs(dy)>80)return;if(dx>0&&sx<40&&!state.menu){state.menu=true;render()}else if(dx<0&&state.menu){state.menu=false;render()}},{passive:true});
}
initChartInteractions();
initSwipeMenu();
boot();
</script></body></html>
